<form data-filters data-for="hlist" class="space-y-6" aria-label="{{ t('Filter hotels','হোটেল ফিল্টার') }}">
  <div><label class="label" for="{{ pfx }}-q">{{ t('Property name','প্রপার্টির নাম') }}</label><input id="{{ pfx }}-q" name="q" class="input" placeholder="{{ t('e.g. Ocean Pearl','যেমন ওশান পার্ল') }}"></div>
  <fieldset><legend class="label">{{ t('Star rating','তারকা') }}</legend><div class="flex flex-wrap gap-2">{% for s in [5,4,3] %}<label class="cursor-pointer"><input type="checkbox" name="stars" value="{{ s }}" class="peer sr-only"><span class="chip peer-checked:border-brand-600 peer-checked:bg-brand-700 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-brand-500">{{ digits(s) }} {{ icon('star','h-3.5 w-3.5 fill-current') }}</span></label>{% endfor %}</div></fieldset>
  <fieldset><legend class="label">{{ t('Guest rating','অতিথি রেটিং') }}</legend><div class="space-y-2">{% for v,l in [('',('Any','যেকোনো')),('9',('Excellent 9+','চমৎকার ৯+')),('8.5',('Very good 8.5+','খুব ভালো ৮.৫+'))] %}<label class="flex items-center gap-2.5 text-sm"><input type="radio" class="check rounded-full" name="rating" value="{{ v }}" {{ 'checked' if loop.first }}> {{ t(*l) }}</label>{% endfor %}</div></fieldset>
  <div><label class="label" for="{{ pfx }}-price">{{ t('Max per night','প্রতি রাত সর্বোচ্চ') }}: <span class="text-brand-700 dark:text-brand-300" data-maxprice-out>{{ bdt(60000) }}</span></label><input id="{{ pfx }}-price" type="range" name="maxprice" min="5000" max="60000" step="500" value="60000" class="w-full"></div>
  <div class="flex gap-2"><button type="reset" class="btn btn-ghost flex-1">{{ t('Reset','রিসেট') }}</button><button class="btn btn-primary flex-1 lg:hidden">{{ t('Show results','ফলাফল দেখুন') }}</button></div>
</form>
