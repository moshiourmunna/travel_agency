<dialog id="lightbox" class="w-full max-w-5xl bg-transparent p-0 backdrop:bg-ink-950/90" aria-label="{{ t('Photo viewer','ছবি দর্শক') }}">
  <div class="relative">
    <img src="" alt="" class="max-h-[80vh] w-full rounded-2xl object-contain" width="1600" height="1000">
    <button type="button" data-modal-close class="absolute right-3 top-3 grid h-10 w-10 place-items-center rounded-full bg-white/90 text-ink-900" aria-label="{{ t('Close','বন্ধ') }}">{{ icon('x') }}</button>
    <button type="button" data-lb-prev class="absolute left-3 top-1/2 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/90 text-ink-900" aria-label="{{ t('Previous photo','আগের ছবি') }}">{{ icon('chevron-left') }}</button>
    <button type="button" data-lb-next class="absolute right-3 top-1/2 grid h-11 w-11 -translate-y-1/2 place-items-center rounded-full bg-white/90 text-ink-900" aria-label="{{ t('Next photo','পরের ছবি') }}">{{ icon('chevron-right') }}</button>
    <p data-lb-cap class="mt-3 text-center text-sm text-white"></p>
  </div>
</dialog>
