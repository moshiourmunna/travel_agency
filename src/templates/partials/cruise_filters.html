<form data-filters data-for="clist" class="space-y-6" aria-label="{{ t('Filter cruises','ক্রুজ ফিল্টার') }}">
  <fieldset><legend class="label">{{ t('Region','অঞ্চল') }}</legend><div class="space-y-2">{% for k,v in D.CRUISE_REGIONS.items() %}<label class="flex items-center gap-2.5 text-sm"><input type="checkbox" class="check" name="region" value="{{ k }}"> {{ v|tr }}</label>{% endfor %}</div></fieldset>
  <fieldset><legend class="label">{{ t('Length','সময়কাল') }}</legend><div class="space-y-2">{% for v,l in [('',('Any','যেকোনো')),('1-3',('1–3 nights','১–৩ রাত')),('4-5',('4–5 nights','৪–৫ রাত')),('6-14',('6+ nights','৬+ রাত'))] %}<label class="flex items-center gap-2.5 text-sm"><input type="radio" class="check rounded-full" name="dur" value="{{ v }}" {{ 'checked' if loop.first }}> {{ t(*l) }}</label>{% endfor %}</div></fieldset>
  <div><label class="label" for="{{ pfx }}-price">{{ t('Max per person','জনপ্রতি সর্বোচ্চ') }}: <span class="text-brand-700 dark:text-brand-300" data-maxprice-out>{{ bdt(200000) }}</span></label><input id="{{ pfx }}-price" type="range" name="maxprice" min="20000" max="200000" step="5000" value="200000" class="w-full"></div>
  <div class="flex gap-2"><button type="reset" class="btn btn-ghost flex-1">{{ t('Reset','রিসেট') }}</button><button class="btn btn-primary flex-1 lg:hidden">{{ t('Show results','ফলাফল দেখুন') }}</button></div>
</form>
