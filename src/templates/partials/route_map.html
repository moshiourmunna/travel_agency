{# stops: list of labels; renders an offline stylised route map #}
{% set n = stops|length %}
<figure class="overflow-hidden rounded-3xl border border-ink-100 dark:border-ink-800">
<svg viewBox="0 0 800 380" class="h-auto w-full" role="img" aria-label="{{ t('Route map','রুট ম্যাপ') }}: {{ stops|join(' → ') }}">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D3F4EE"/><stop offset="1" stop-color="#A8E8DD"/></linearGradient>
    <pattern id="mgrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0D6B65" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="800" height="380" fill="url(#sea)"/>
  <rect width="800" height="380" fill="url(#mgrid)"/>
  <path d="M-20 300 C120 250 160 330 300 290 S520 210 600 250 S760 330 840 280 L840 400 L-20 400Z" fill="#F5ECCB" opacity=".9"/>
  <path d="M-20 120 C80 60 200 140 320 90 S520 20 620 70 S780 40 840 60 L840 -20 L-20 -20Z" fill="#EEDCA0" opacity=".55"/>
  {% set pts = [] %}
  {% for i in range(n) %}{% set x = 80 + (640 * i / ([n-1,1]|max)) %}{% set y = 190 + (60 if i % 2 else -45) %}{% set _ = pts.append((x|round(1), y)) %}{% endfor %}
  <path d="M{% for x,y in pts %}{{ x }} {{ y }}{% if not loop.last %} L{% endif %}{% endfor %}" fill="none" stroke="#0D6B65" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  {% for x,y in pts %}
  <g transform="translate({{ x }} {{ y }})">
    <circle r="17" fill="{{ '#F6A33B' if loop.first or loop.last else '#0D6B65' }}" stroke="#fff" stroke-width="4"/>
    <text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="{{ '#0B1B2B' if loop.first or loop.last else '#fff' }}">{{ digits(loop.index) }}</text>
    <text y="{{ 38 if loop.index is odd else -28 }}" text-anchor="middle" font-size="13" font-weight="700" fill="#0B1B2B">{{ stops[loop.index0]|truncate(22, True, '…') }}</text>
  </g>
  {% endfor %}
  <g transform="translate(740 330)"><circle r="22" fill="#fff" opacity=".85"/><path d="M0 -14 L5 0 L0 14 L-5 0Z" fill="#0D6B65"/><text y="-17" text-anchor="middle" font-size="10" font-weight="800" fill="#0B1B2B">N</text></g>
</svg>
<figcaption class="flex items-center justify-between gap-3 bg-white px-4 py-3 text-xs muted dark:bg-ink-900"><span>{{ t('Indicative route — not to scale','নির্দেশক রুট — স্কেল অনুযায়ী নয়') }}</span><a class="link" href="https://www.openstreetmap.org/search?query={{ map_q|urlencode }}" target="_blank" rel="noopener">{{ t('Open in map','ম্যাপে খুলুন') }} ↗</a></figcaption>
</figure>
